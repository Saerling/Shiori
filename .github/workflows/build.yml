name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Para publicar cada versión en «Releases» (de ahí la descarga la app para actualizarse).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.9

      - name: Compilar APK (debug)
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build-debug.log

      # Si falla, los errores de compilación salen como avisos del run (se ven en la pestaña "Summary").
      - name: Resumen de errores
        if: failure()
        run: |
          grep -E "^e: |error:|ERROR:|What went wrong|> " build-debug.log | grep -v "^> Task" | head -80 > errores.txt || true
          echo "## Errores de compilación" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat errores.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          msg=$(sed -e 's/%/%25/g' errores.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Errores de compilación::${msg}"

      - uses: actions/upload-artifact@v4
        with:
          name: lector-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # APK optimizado (R8, sin ofuscar). Si esto falla, el APK debug sigue disponible.
      - name: Compilar APK optimizado (release)
        id: release
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee build-release.log

      - name: Resumen de errores (release)
        if: steps.release.outcome == 'failure'
        run: |
          grep -E "^e: |error:|ERROR:|What went wrong|Missing class|> " build-release.log | grep -v "^> Task" | head -80 > errores-r.txt || true
          msg=$(sed -e 's/%/%25/g' errores-r.txt | awk '{printf "%s%%0A", $0}')
          echo "::warning title=Errores en release::${msg}"

      - uses: actions/upload-artifact@v4
        if: steps.release.outcome == 'success'
        with:
          name: lector-release-apk
          path: app/build/outputs/apk/release/*.apk

      # Rotación de firma (APK Signature Scheme v3): el APK lleva la clave vieja para Android 8 (v2) y la nueva para
      # Android 9+ (v3) junto con app/firma/linaje.bin, la prueba firmada de que la vieja autoriza a la nueva. Así se
      # actualiza encima sin desinstalar y, una vez instalado, un APK firmado solo con la clave vieja ya no entra.
      # La clave nueva vive solo en los secretos SHIORI_KEYSTORE_B64 / SHIORI_KEYSTORE_PASSWORD (ver SEGURIDAD.md).
      - name: Firmar con la clave nueva
        if: steps.release.outcome == 'success'
        env:
          KS: ${{ secrets.SHIORI_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SHIORI_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ]; then
            echo "::warning title=Firma::Faltan los secretos SHIORI_KEYSTORE_B64 / SHIORI_KEYSTORE_PASSWORD: se publica con la clave vieja."
            exit 0
          fi
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KS" | base64 -d > "$RUNNER_TEMP/nueva.jks"
          apk=app/build/outputs/apk/release/app-release.apk
          "$bt/apksigner" sign --ks app/firma/shiori.jks --ks-key-alias shiori --ks-pass pass:shiori-lector \
            --next-signer --ks "$RUNNER_TEMP/nueva.jks" --ks-key-alias shiori2 --ks-pass env:KS_PASS \
            --lineage app/firma/linaje.bin --rotation-min-sdk-version 28 --out "$RUNNER_TEMP/rotado.apk" "$apk"
          rm -f "$RUNNER_TEMP/nueva.jks"
          # Comprobación: Android 8 ve la clave vieja y Android 9+ la nueva; si no, no se publica.
          v=$("$bt/apksigner" verify --print-certs --min-sdk-version 26 --max-sdk-version 27 "$RUNNER_TEMP/rotado.apk" | grep -c 3fdd72a167df2e0c)
          n=$("$bt/apksigner" verify --print-certs --min-sdk-version 28 "$RUNNER_TEMP/rotado.apk" | grep -c e68d6bede0401c8f)
          [ "$v" = 1 ] && [ "$n" = 1 ] || { echo "::error title=Firma::La rotación no quedó bien (v2=$v v3=$n)"; exit 1; }
          mv "$RUNNER_TEMP/rotado.apk" "$apk"
          echo "Firmado con rotación v3 (vieja → nueva)" >> "$GITHUB_STEP_SUMMARY"

      # Cada compilación de las ramas principales se publica como versión. La app mira la última («latest») y, si su
      # número (lo que va tras el último guion de la etiqueta) es mayor que el suyo, ofrece descargarla e instalarla.
      - name: Publicar versión
        if: steps.release.outcome == 'success' && (github.ref_name == 'claude/komikku' || github.ref_name == 'main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nombre=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          codigo=$((1000 + ${{ github.run_number }}))
          apk="shiori-${nombre}-${codigo}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          git log -1 --format=%B | grep -v -E "^(Co-Authored-By|Claude-Session):" > notas.txt
          gh release create "v${nombre}-${codigo}" "$apk" --target "$GITHUB_SHA" \
            --title "Shiori ${nombre} (compilación ${codigo})" --notes-file notas.txt --latest
          # Se guardan solo las 10 más recientes.
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' | while read -r t; do
            gh release delete "$t" --yes --cleanup-tag || true
          done
