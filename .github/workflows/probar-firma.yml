name: Probar rotación de firma

# Comprueba en emuladores reales (Android 8 y 14) que un APK con la clave vieja se actualiza al rotado sin
# desinstalar, que la app abre, y que después un APK firmado solo con la clave vieja ya NO puede instalarse encima.
on:
  workflow_dispatch:
  push:
    paths: ['app/firma/**', '.github/workflows/probar-firma.yml', '.github/workflows/build.yml']

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar APKs (vieja y rotada)
        env:
          GH_TOKEN: ${{ github.token }}
          KS: ${{ secrets.SHIORI_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SHIORI_KEYSTORE_PASSWORD }}
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1); echo "BT=$bt" >> "$GITHUB_ENV"
          gh release download -R "$GITHUB_REPOSITORY" -p '*.apk' -O base.apk
          "$bt/apksigner" sign --ks app/firma/shiori.jks --ks-key-alias shiori --ks-pass pass:shiori-lector --out vieja.apk base.apk
          if [ -n "$KS" ] && [ -n "$KS_PASS" ]; then
            echo "$KS" | base64 -d > nueva.jks; lin=app/firma/linaje.bin; echo "Clave: la real" >> "$GITHUB_STEP_SUMMARY"
          else
            export KS_PASS=prueba-prueba
            keytool -genkeypair -keystore nueva.jks -storetype PKCS12 -storepass "$KS_PASS" -keypass "$KS_PASS" -alias shiori2 \
              -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Prueba"
            "$bt/apksigner" rotate --out lin.bin --old-signer --ks app/firma/shiori.jks --ks-key-alias shiori --ks-pass pass:shiori-lector \
              --new-signer --ks nueva.jks --ks-key-alias shiori2 --ks-pass env:KS_PASS
            lin=lin.bin; echo "Clave: de prueba (faltan los secretos)" >> "$GITHUB_STEP_SUMMARY"
          fi
          "$bt/apksigner" sign --ks app/firma/shiori.jks --ks-key-alias shiori --ks-pass pass:shiori-lector \
            --next-signer --ks nueva.jks --ks-key-alias shiori2 --ks-pass env:KS_PASS \
            --lineage "$lin" --rotation-min-sdk-version 28 --out rotada.apk base.apk
          rm -f nueva.jks
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar y actualizar
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/probar-firma.sh ${{ matrix.api }}
